[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdakit"
version = "1.0.0"
description = "Boîte à outils générique d'aide à la décision multicritère : AHP, Delphi, somme pondérée, TOPSIS, portefeuilles sous contraintes et analyse de sensibilité."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "openpyxl>=3.1", "pyyaml>=6.0", "fastapi>=0.110", "python-multipart>=0.0.9", "fpdf2>=2.7"]

[project.optional-dependencies]
web = ["uvicorn>=0.29"]
dev = ["pytest>=7", "httpx>=0.27"]
validation = ["pymcdm>=1.4; python_version >= '3.11'", "pyDecision>=4.0; python_version >= '3.11'"]

[project.scripts]
mcdakit = "mcdakit.cli:main"

[tool.setuptools]
packages = ["mcdakit"]

[tool.setuptools.package-data]
mcdakit = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
